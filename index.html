<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{background-color: black;}
        .container{width: 300px;height: 300px;margin: 50px;}
        .person{position: relative;left: 150px;top: 160px;animation: move 3s infinite ease-in-out;}
        .head{position: absolute;top: -30px;left: -6px;
            width: 30px;height: 30px;border: 5px solid white;
            border-radius:50%; 
            animation: bob 2s infinite alternate;}
        .torso{position: absolute;top: 15px;left: 0px;
            width: 0;height: 60px;border-left: 5px solid white;}
        .person .part{position: absolute;left: 0;top:15px;}
        .person .part.arm{width: 40px;height: 45px;
            border-left: 5px solid white;border-bottom: 5px solid white;
            position: absolute;top: 15px;right: 300px;transform-origin: 0% 0% 0px;
            animation:pump 1s infinite ease-in-out ;}
        .person .part.arm.one{transform: rotate3d(0,0,1,80deg);}
        .person .part.arm.two{transform: rotate3d(0,0,1,-80deg);animation-delay: 0.5s;}
                                                /* animation-delay:延迟动画 */
        .person .part.leg{height: 60px;width: 60px;
            border-right: 5px solid white;border-top: 5px solid white;transform-origin: 0% 0% 0px;
            animation:run 1s infinite ease-in-out ;}
        .person .part.leg.one{transform: rotate3d(0,0,1,100deg);left: 0px;top:75px;}
        .person .part.leg.two{transform: rotate3d(0,0,1,10deg);right: -60px;top:75px;animation-delay: 0.5s;}
        /* 头部动画 */
        @keyframes bob{
            0%{transform: rotate3d(0,0,1,5deg);}
            25%{transform: rotate3d(0,0,1,-30deg) skew(15deg,0deg);}
            50%{transform: rotate3d(0,0,1,5deg);}
            75%{transform: rotate3d(0,0,1,-30deg) skew(-15deg,0deg);}
            100%{transform: rotate3d(0,0,1,20deg) skew(-5deg,0deg)}}
        /* 胳膊动画 */
        @keyframes pump{
            0%{transform: rotate3d(0,0,1,80deg);}
            50%{transform: rotate3d(0,0,1,-70deg);}
            100%{transform: rotate3d(0,0,1,80deg);}}
        /* 腿部动画 */
        @keyframes run{
            0%{transform: rotate3d(0,0,1,100deg);}
            50%{transform: rotate3d(0,0,1,10deg);}
            100%{transform: rotate3d(0,0,1,100deg);}}
        /* 让人物向前跑起来 */
        @keyframes move{
            0%{left: -100px;}
            100%{left: 1000px;}}
    </style>
</head>
<body>
    <!-- 火柴人结构 -->
     <div class="container">
        <div class="person">
            <div class="head"></div>
            <div class="part arm one"></div>
            <div class="part arm two"></div>
            <div class="torso"></div>
            <div class="part leg one"></div>
            <div class="part leg two"></div>
        </div>
     </div>
</body>
</html>
